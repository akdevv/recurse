<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0f11" />
    <title>Recurse · offline</title>
    <link rel="icon" type="image/png" href="/icon-96.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0f11;
        color: #e2e8ea;
        font:
          14px/1.6 ui-sans-serif,
          system-ui,
          sans-serif;
      }
      main {
        max-width: 26rem;
        padding: 2rem;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin: 1rem 0 0.25rem;
        font-size: 1.25rem;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0.5rem 0;
        color: #86949a;
      }
      code {
        background: #192024;
        padding: 0.1rem 0.4rem;
        border-radius: 4px;
        color: #e2e8ea;
        font-size: 0.9em;
      }
      button {
        margin-top: 1.25rem;
        height: 36px;
        padding: 0 1rem;
        border: 0;
        border-radius: 6px;
        background: #3fbfae;
        color: #06201c;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #57c9ba;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>Recurse is offline</h1>
      <p>
        Recurse runs on a small server on this Mac, and it isn't answering right
        now.
      </p>
      <p>
        It normally starts at login. To restart it, run
        <code>launchctl kickstart -k gui/$(id -u)/dev.akdevv.rcx</code>
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
